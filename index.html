<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0c0f14;
    --panel: #151a22;
    --panel2: #1c232e;
    --accent: #f6c945;
    --text: #e8edf2;
    --muted: #8b96a5;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a2330 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .stage-wrap { position: relative; }
  canvas#game {
    display: block;
    width: min(92vw, 520px);
    height: auto;
    image-rendering: pixelated;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px #2a3340 inset;
    background: #000;
  }
  .hud {
    width: 220px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid #2a3340;
    border-radius: 12px;
    padding: 12px 14px;
  }
  .card h2 {
    font-size: 12px; letter-spacing: 2px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
  }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; }
  .stat-row .label { color: var(--muted); font-size: 14px; }
  .stat-row .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .value.score { color: var(--accent); }
  .value.lives { color: #7dd8a0; }
  .value.level { color: #7fb6ff; }
  .lives-icons { display: flex; gap: 6px; margin-top: 6px; }
  .lives-icons .tank-ico {
    width: 30px; height: 30px; border-radius: 6px;
    background: radial-gradient(circle at 50% 40%, #ffe08a, #d9a520 80%);
    box-shadow: inset 0 0 0 2px #8a6a10;
  }
  .lives-icons .tank-ico.off { filter: grayscale(1) brightness(.35); }
  .enemies-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .enemies-row .enemy-ico {
    width: 14px; height: 14px; border-radius: 3px;
    background: #c8cdd4; box-shadow: inset 0 0 0 1.5px #6d7480;
  }
  .btn {
    border: 1px solid #2a3340; background: var(--panel2); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .btn:hover { background: #232c38; }
  .btn-row { display: flex; gap: 8px; }
  .keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .keys b { color: var(--text); font-weight: 600; }
  .tag {
    font-size: 11px; color: var(--accent); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  /* overlay */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,8,12,.78); backdrop-filter: blur(3px); z-index: 20;
    opacity: 1; transition: opacity .25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .ov-box {
    text-align: center; max-width: 360px; padding: 28px;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid #2f3a47; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .ov-box h1 { font-size: 34px; letter-spacing: 4px; margin-bottom: 4px; color: var(--accent); }
  .ov-box .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .ov-box .big { font-size: 22px; font-weight: 700; margin: 10px 0 4px; }
  .ov-box .hint { color: var(--muted); font-size: 13px; margin-top: 16px; }
  .ov-box .final { font-size: 16px; color: var(--accent); font-weight: 700; margin-top: 6px; }
  /* touch controls */
  #touch { display: none; gap: 12px; align-items: flex-end; justify-content: center; margin-top: 12px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .dpad button {
    border: 1px solid #33404f; background: #1c232e; color: #cdd6e0;
    font-size: 20px; border-radius: 10px; touch-action: none; cursor: pointer;
  }
  .dpad button:active { background: #2a3644; }
  .fire-btn {
    width: 86px; height: 86px; border-radius: 50%; border: 1px solid #5a4630;
    background: radial-gradient(circle at 50% 38%, #d9a520, #8a6a10);
    color: #fff; font-weight: 700; font-size: 16px; touch-action: none; cursor: pointer;
  }
  .fire-btn:active { filter: brightness(1.2); }
  @media (hover: none) and (pointer: coarse) {
    #touch { display: flex; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="stage-wrap">
      <canvas id="game" width="520" height="520"></canvas>
      <div id="touch">
        <div class="dpad">
          <button data-k="up" style="grid-area:1/2">▲</button>
          <button data-k="left" style="grid-area:2/1">◀</button>
          <button data-k="down" style="grid-area:2/2">▼</button>
          <button data-k="right" style="grid-area:2/3">▶</button>
        </div>
        <button class="fire-btn" data-k="fire">开火</button>
      </div>
    </div>
    <div class="hud">
      <div class="card">
        <div class="tag">Tank Battle</div>
        <h2>得分 Score</h2>
        <div class="stat-row"><span class="label">SCORE</span><span class="value score" id="hud-score">0</span></div>
        <div class="stat-row" style="margin-top:6px"><span class="label">最高分</span><span class="value" id="hud-hi" style="font-size:16px">0</span></div>
      </div>
      <div class="card">
        <h2>生命 Lives</h2>
        <div class="lives-icons" id="hud-lives"></div>
      </div>
      <div class="card">
        <h2>进度 Progress</h2>
        <div class="stat-row"><span class="label">关卡</span><span class="value level" id="hud-level">1</span></div>
        <div class="stat-row" style="margin-top:4px"><span class="label">剩余敌人</span></div>
        <div class="enemies-row" id="hud-enemies"></div>
      </div>
      <div class="card">
        <h2>操作 Controls</h2>
        <div class="keys">
          <b>WASD / 方向键</b> — 移动<br>
          <b>空格 / J</b> — 开火<br>
          <b>P</b> — 暂停 · <b>M</b> — 静音<br>
          摧毁所有敌人并守住基地即可过关
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-pause">暂停</button>
        <button class="btn" id="btn-sound">声音:开</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="ov-box">
      <h1>坦克大战</h1>
      <div class="sub">TANK BATTLE</div>
      <div class="big" id="ov-title">准备就绪</div>
      <div class="final" id="ov-final"></div>
      <div class="hint" id="ov-hint">按 <b>Enter</b> 开始游戏</div>
    </div>
  </div>

<script>
"use strict";
/* =========================================================
   坦克大战 (Battle City clone) — 单文件 Canvas 实现
   ========================================================= */

const TILE = 40;          // 单个格子像素
const GRID = 13;          // 13 x 13 地图
const CANVAS = TILE * GRID; // 520
const TANK = 40;          // 碰撞盒（一格大小）
const DRAW_TANK = 36;     // 绘制大小（略小于格子，视觉留白）
const BULLET = 8;

const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4;

// 基地（老鹰）位置：底边中央一格
const BASE_C = 6, BASE_R = 12;

// 方向：0上 1右 2下 3左
const DIRS = [
  { dx: 0, dy: -1, ang: 0 },
  { dx: 1, dy: 0, ang: Math.PI / 2 },
  { dx: 0, dy: 1, ang: Math.PI },
  { dx: -1, dy: 0, ang: -Math.PI / 2 },
];
const opposite = d => (d + 2) % 4;

/* ---------- 地图 ---------- */
// . 空地  B 砖墙  S 钢墙  W 水  T 树
const MAPS = [
  [ // 第 1 关
    ".............",
    "B.B.B.B.B.B.B",
    ".............",
    ".BBBB...BBBB.",
    ".B..B...B..B.",
    ".B..BBBBB..B.",
    ".B..B...B..B.",
    ".BBBB...BBBB.",
    ".............",
    "..SS.....SS..",
    "..S.......S..",
    ".............",
    ".............",
  ],
  [ // 第 2 关
    ".............",
    ".....SSS.....",
    ".BB.B.B.B.BB.",
    ".BB.B.B.B.BB.",
    ".....S.S.....",
    ".BB.BS.SB.BB.",
    ".BB.B.B.B.BB.",
    ".....S.S.....",
    ".BB.B.B.B.BB.",
    "..W.......W..",
    "..W..SSS..W..",
    ".............",
    ".............",
  ],
  [ // 第 3 关
    ".............",
    ".T.T.T.T.T.T.",
    ".............",
    ".WWW.....WWW.",
    ".W.W.BBB.W.W.",
    ".W.W.B.B.W.W.",
    ".W.W.B.B.W.W.",
    ".W.W.BBB.W.W.",
    ".WWW.....WWW.",
    ".............",
    ".T.T.SSS.T.T.",
    ".............",
    ".............",
  ],
];

/* ---------- 敌人类型 ---------- */
const ENEMY_TYPES = [
  { name: "basic",  speed: 2,    hp: 1, score: 100, color: "#c8cdd4", aggression: 0.55, cooldown: 1.6 },
  { name: "fast",   speed: 4,    hp: 1, score: 200, color: "#9fd6ff", aggression: 0.65, cooldown: 1.2 },
  { name: "power",  speed: 3,    hp: 1, score: 300, color: "#ff9fb8", aggression: 0.85, cooldown: 1.0, drop: true },
  { name: "armor",  speed: 2,    hp: 3, score: 400, color: "#b0f0a0", aggression: 0.6,  cooldown: 1.5 },
];
const ENEMIES_PER_LEVEL = 20;

/* ---------- 全局状态 ---------- */
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");

let grid;                 // 13x13 当前地图格子
let tanks = [];           // 所有坦克
let bullets = [];
let particles = [];
let powerups = [];
let player = null;
let baseAlive = true;

let score = 0, hiScore = 0, level = 1, lives = 3;
let state = "menu";       // menu | playing | paused | levelclear | gameover
let frozen = 0, shield = 0;

let spawnQueue = [];      // 待出生的敌人类型
let enemiesLeft = 0;

let keys = new Set();
let time = 0;             // 秒（用于动画）
let shake = 0;

const baseRect = { x: BASE_C * TILE, y: BASE_R * TILE, w: TILE, h: TILE };
const spawnPoints = [ { c: 0, r: 0 }, { c: 6, r: 0 }, { c: 12, r: 0 } ];

/* ---------- 音频 ---------- */
let actx = null, soundOn = true;
function ensureAudio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type = "square", vol = 0.05, slide = 0) {
  if (!soundOn) return;
  try {
    ensureAudio(); if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function noiseBurst(dur = 0.3, vol = 0.12) {
  if (!soundOn) return;
  try {
    ensureAudio(); if (!actx) return;
    const n = actx.sampleRate * dur;
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    src.connect(g); g.connect(actx.destination); src.start();
  } catch (e) {}
}
const snd = {
  shoot: () => tone(760, 0.07, "square", 0.04, -300),
  hitSteel: () => tone(180, 0.05, "triangle", 0.05),
  hitBrick: () => tone(300, 0.04, "square", 0.04),
  explode: () => { noiseBurst(0.35, 0.14); tone(130, 0.35, "sawtooth", 0.06, -80); },
  playerDie: () => { noiseBurst(0.5, 0.16); tone(200, 0.5, "sawtooth", 0.07, -150); },
  baseDie: () => { noiseBurst(0.8, 0.2); tone(90, 0.8, "sawtooth", 0.08, -40); },
  powerup: () => { tone(523, 0.09, "square", 0.05); setTimeout(() => tone(784, 0.12, "square", 0.05), 90); },
  levelup: () => { tone(440, 0.09); setTimeout(() => tone(554, 0.09), 100); setTimeout(() => tone(659, 0.14), 200); },
};

/* ---------- 工具 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function tileAt(c, r) {
  if (r < 0 || r >= GRID || c < 0 || c >= GRID) return STEEL;
  return grid[r][c];
}
function isSolid(t) { return t === BRICK || t === STEEL || t === WATER; }

function rectHitsSolid(x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (isSolid(tileAt(c, r))) return true;
  return false;
}

/* ---------- 关卡加载 ---------- */
function loadLevel(n) {
  const map = MAPS[(n - 1) % MAPS.length];
  grid = Array.from({ length: GRID }, (_, r) =>
    Array.from({ length: GRID }, (_, c) => {
      const ch = map[r][c];
      if (ch === "B") return BRICK;
      if (ch === "S") return STEEL;
      if (ch === "W") return WATER;
      if (ch === "T") return TREE;
      return EMPTY;
    })
  );
  // 基地周围的保护墙
  grid[BASE_R - 1][BASE_C] = BRICK;
  grid[BASE_R][BASE_C - 1] = BRICK;
  grid[BASE_R][BASE_C + 1] = BRICK;

  tanks = []; bullets = []; particles = []; powerups = [];
  baseAlive = true;

  // 生成敌人队列
  spawnQueue = [];
  const count = ENEMIES_PER_LEVEL + (n - 1) * 2;
  for (let i = 0; i < count; i++) {
    let t = 0;
    if (i < count * 0.5) t = 0;
    else if (i < count * 0.7) t = 1;
    else if (i < count * 0.85) t = 3;
    else t = 2;
    spawnQueue.push(ENEMY_TYPES[t]);
  }
  enemiesLeft = spawnQueue.length;

  spawnPlayer();
}

function spawnPlayer() {
  // 清除已死亡的旧玩家对象，避免累积
  for (let i = tanks.length - 1; i >= 0; i--)
    if (tanks[i].isPlayer && !tanks[i].alive) tanks.splice(i, 1);
  const x = 4 * TILE, y = 12 * TILE;
  player = {
    x, y, dir: 0, speed: 3, alive: true, isPlayer: true,
    level: 0, invincible: 2.2, shootCooldown: 0.35, shootTimer: 0,
    tread: 0,
  };
  tanks.push(player);
  window.__deathHandled = false;
}

function spawnEnemy(type) {
  const pt = spawnPoints.find(p => !tanks.some(t => t.alive && Math.floor(t.x / TILE) === p.c && Math.floor(t.y / TILE) === p.r));
  const p = pt || spawnPoints[randInt(0, 2)];
  const e = {
    x: p.c * TILE, y: p.r * TILE, dir: 2, speed: type.speed,
    alive: true, isPlayer: false, type, hp: type.hp,
    spawnTimer: 0.8, moveTimer: rand(0.4, 1.2), shootTimer: rand(0.5, 1.5),
    tread: 0,
  };
  tanks.push(e);
  return e;
}

/* ---------- 移动与碰撞 ---------- */
function canMove(tank, dx, dy) {
  const nx = tank.x + dx, ny = tank.y + dy;
  if (nx < 0 || ny < 0 || nx + TANK > CANVAS || ny + TANK > CANVAS) return false;
  if (rectHitsSolid(nx, ny, TANK, TANK)) return false;
  const r = { x: nx, y: ny, w: TANK, h: TANK };
  if (baseAlive && rectsOverlap(r, baseRect)) return false;
  for (const t of tanks) {
    if (t === tank || !t.alive) continue;
    if (rectsOverlap(r, { x: t.x, y: t.y, w: TANK, h: TANK })) return false;
  }
  return true;
}

function moveTank(tank, dx, dy) {
  if (canMove(tank, dx, dy)) { tank.x += dx; tank.y += dy; return true; }
  return false;
}

/* ---------- 子弹 ---------- */
function spawnBullet(tank, dir) {
  let max = 1, speed = 8, power = false;
  if (tank.isPlayer) {
    max = tank.level >= 2 ? 2 : 1;
    speed = tank.level >= 1 ? 10 : 8;
    power = tank.level >= 3;
    if (bullets.filter(b => b.owner === tank).length >= max) return;
    snd.shoot();
  }
  const cx = tank.x + TANK / 2, cy = tank.y + TANK / 2;
  const v = DIRS[dir];
  const b = {
    x: cx + v.dx * (TANK / 2) - BULLET / 2,
    y: cy + v.dy * (TANK / 2) - BULLET / 2,
    dir, speed, power, owner: tank, alive: true,
  };
  bullets.push(b);
}

function bulletHitTile(b) {
  const px = b.x + BULLET / 2 + DIRS[b.dir].dx * (BULLET / 2 + 1);
  const py = b.y + BULLET / 2 + DIRS[b.dir].dy * (BULLET / 2 + 1);
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  const t = tileAt(c, r);
  if (t === BRICK) {
    if (b.dir === 0 || b.dir === 2) { grid[r][c] = EMPTY; } // 纵向打穿一格
    else {
      // 横向：打掉上下相邻的一格（模拟炸开一层）
      grid[r][c] = EMPTY;
    }
    snd.hitBrick(); spawnDust(c, r, "#c9793a");
    return true;
  }
  if (t === STEEL) {
    if (b.power) { grid[r][c] = EMPTY; snd.hitSteel(); spawnDust(c, r, "#8b96a5"); return true; }
    snd.hitSteel(); return true;
  }
  return false;
}

function destroyTank(t, byPlayer) {
  if (!t.alive) return;
  t.alive = false;
  explode(t.x + TANK / 2, t.y + TANK / 2, t.isPlayer ? "#f6c945" : "#c8cdd4");
  if (t.isPlayer) {
    snd.playerDie();
    lives--;
    shake = 0.4;
  } else {
    snd.explode();
    score += t.type.score;
    enemiesLeft = Math.max(0, enemiesLeft - 1);
    if (byPlayer) {
      if (t.type.drop && Math.random() < 0.5) {
        const kinds = ["star", "tank", "grenade", "helmet", "clock"];
        powerups.push({ x: t.x, y: t.y, kind: kinds[randInt(0, 4)], timer: 10 });
      }
    }
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (!b.alive) continue;
    let steps = b.speed;
    while (steps-- > 0) {
      b.x += DIRS[b.dir].dx;
      b.y += DIRS[b.dir].dy;
      if (b.x < -BULLET || b.y < -BULLET || b.x > CANVAS || b.y > CANVAS) { b.alive = false; break; }

      // 撞墙
      if (bulletHitTile(b)) { b.alive = false; break; }

      // 撞基地
      if (baseAlive && rectsOverlap({ x: b.x, y: b.y, w: BULLET, h: BULLET }, baseRect)) {
        b.alive = false; baseDestroyed(); break;
      }

      // 撞坦克
      let hit = false;
      for (const t of tanks) {
        if (!t.alive || t === b.owner) continue;
        if (rectsOverlap({ x: b.x, y: b.y, w: BULLET, h: BULLET }, { x: t.x, y: t.y, w: TANK, h: TANK })) {
          b.alive = false;
          if (t.isPlayer) {
            if (t.invincible > 0 || shield > 0) { snd.hitSteel(); }
            else destroyTank(t, false);
          } else {
            if (t.spawnTimer > 0) { snd.hitSteel(); }
            else {
              t.hp--;
              if (t.hp <= 0) destroyTank(t, true);
              else { snd.hitSteel(); explode(t.x + TANK / 2, t.y + TANK / 2, "#ffffff"); }
            }
          }
          hit = true; break;
        }
      }
      if (hit) break;
    }
  }
  bullets = bullets.filter(b => b.alive);

  // 子弹互撞
  for (let i = 0; i < bullets.length; i++) {
    for (let j = i + 1; j < bullets.length; j++) {
      const a = bullets[i], b = bullets[j];
      if (!a.alive || !b.alive) continue;
      if (a.owner !== b.owner && rectsOverlap({ x: a.x, y: a.y, w: BULLET, h: BULLET }, { x: b.x, y: b.y, w: BULLET, h: BULLET })) {
        a.alive = b.alive = false;
        explode(a.x, a.y, "#ffffff", true);
      }
    }
  }
  bullets = bullets.filter(b => b.alive);
}

/* ---------- 敌人 AI ---------- */
function enemyChooseDir(e) {
  const toX = baseRect.x + TILE / 2 - (e.x + TANK / 2);
  const toY = baseRect.y + TILE / 2 - (e.y + TANK / 2);
  const options = [];
  for (let d = 0; d < 4; d++) {
    if (d === opposite(e.dir)) continue;
    const v = DIRS[d];
    if (canMove(e, v.dx * 8, v.dy * 8)) options.push(d);
  }
  if (options.length === 0) return opposite(e.dir);
  // 依据与基地方向的点积评分（略带随机）
  let best = options[0], bestScore = -Infinity;
  for (const d of options) {
    const v = DIRS[d];
    const dot = v.dx * toX + v.dy * toY;
    const s = dot + Math.random() * 160;
    if (s > bestScore) { bestScore = s; best = d; }
  }
  return best;
}

function updateEnemies(dt) {
  for (const e of tanks) {
    if (!e.alive || e.isPlayer) continue;
    if (e.spawnTimer > 0) { e.spawnTimer -= dt; continue; }

    if (frozen > 0) continue;

    e.shootTimer -= dt;
    e.moveTimer -= dt;

    const v = DIRS[e.dir];
    const moved = moveTank(e, v.dx * e.speed, v.dy * e.speed);
    if (moved) e.tread += e.speed;
    if (!moved || e.moveTimer <= 0) {
      e.dir = enemyChooseDir(e);
      e.moveTimer = rand(0.5, 1.8);
    }

    if (e.shootTimer <= 0) {
      e.shootTimer = e.type.cooldown * rand(0.7, 1.3);
      if (Math.random() < e.type.aggression) spawnBullet(e, e.dir);
    }
  }
}

/* ---------- 玩家 ---------- */
function updatePlayer(dt) {
  if (!player || !player.alive) return;
  player.shootTimer -= dt;
  if (player.invincible > 0) player.invincible -= dt;

  let dir = null;
  if (keys.has("up") || keys.has("w")) dir = 0;
  else if (keys.has("down") || keys.has("s")) dir = 2;
  else if (keys.has("left") || keys.has("a")) dir = 3;
  else if (keys.has("right") || keys.has("d")) dir = 1;

  if (dir !== null) {
    if (dir !== player.dir) {
      // 转向时对齐网格，避免卡墙
      if (dir === 0 || dir === 2) player.x = Math.round(player.x / 8) * 8;
      else player.y = Math.round(player.y / 8) * 8;
      player.dir = dir;
    }
    const v = DIRS[dir];
    if (moveTank(player, v.dx * player.speed, v.dy * player.speed)) player.tread += player.speed;
  }

  if ((keys.has("fire") || keys.has(" ") || keys.has("j")) && player.shootTimer <= 0) {
    player.shootTimer = player.shootCooldown;
    spawnBullet(player, player.dir);
  }
}

/* ---------- 道具 ---------- */
const POWER_INFO = {
  star: { label: "火力强化", color: "#ffd54a" },
  tank: { label: "加一条命", color: "#7dd8a0" },
  grenade: { label: "全屏炸弹", color: "#ff8a5c" },
  helmet: { label: "护盾", color: "#8fb8ff" },
  clock: { label: "冰冻敌人", color: "#b48cff" },
};

function updatePowerups(dt) {
  for (const p of powerups) p.timer -= dt;
  powerups = powerups.filter(p => p.timer > 0);

  if (player && player.alive) {
    const pr = { x: player.x, y: player.y, w: TANK, h: TANK };
    for (const p of powerups) {
      if (rectsOverlap(pr, { x: p.x, y: p.y, w: TILE, h: TILE })) {
        p.timer = -1;
        applyPower(p.kind);
      }
    }
    powerups = powerups.filter(p => p.timer > 0);
  }
}

function applyPower(kind) {
  snd.powerup();
  if (kind === "star") player.level = Math.min(3, player.level + 1);
  else if (kind === "tank") lives = Math.min(6, lives + 1);
  else if (kind === "grenade") {
    for (const t of tanks) if (t.alive && !t.isPlayer) destroyTank(t, true);
  }
  else if (kind === "helmet") shield = 8;
  else if (kind === "clock") frozen = 8;
  showToast(POWER_INFO[kind].label);
}

/* ---------- 基地被毁 ---------- */
function baseDestroyed() {
  baseAlive = false;
  explode(baseRect.x + TILE / 2, baseRect.y + TILE / 2, "#f6c945");
  snd.baseDie();
  shake = 0.6;
  gameOver();
}

/* ---------- 粒子 ---------- */
function explode(x, y, color, small = false) {
  const n = small ? 6 : 16;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(40, small ? 90 : 180);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), color, size: rand(2, 4) });
  }
}
function spawnDust(c, r, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({ x: c * TILE + rand(6, TILE - 6), y: r * TILE + rand(6, TILE - 6), vx: rand(-60, 60), vy: rand(-60, 60), life: rand(0.2, 0.5), color, size: rand(2, 3) });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

/* ---------- 流程控制 ---------- */
function startGame() {
  score = 0; lives = 3; level = 1;
  frozen = 0; shield = 0;
  loadLevel(1);
  setState("playing");
}

function nextLevel() {
  level++;
  snd.levelup();
  frozen = 0; shield = 0;
  loadLevel(level);
  setState("playing");
}

function onPlayerDeath() {
  if (lives > 0) {
    setTimeout(() => { if (state === "playing" && player && !player.alive) spawnPlayer(); }, 800);
  } else {
    gameOver();
  }
}

function gameOver() {
  setState("gameover");
  if (score > hiScore) { hiScore = score; try { localStorage.setItem("tank-hiscore", hiScore); } catch (e) {} }
}

function checkLevelClear() {
  if (spawnQueue.length === 0 && !tanks.some(t => t.alive && !t.isPlayer)) {
    setState("levelclear");
  }
}

/* ---------- 主循环 ---------- */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;

function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(STEP / 1000); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

function update(dt) {
  time += dt;
  if (shake > 0) shake -= dt;

  if (state === "playing") {
    if (frozen > 0) frozen -= dt;
    if (shield > 0) shield -= dt;

    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);
    updateParticles(dt);

    // 生成敌人
    if (spawnQueue.length > 0) {
      const onScreen = tanks.filter(t => t.alive && !t.isPlayer).length;
      if (onScreen < 5) spawnEnemy(spawnQueue.shift());
    }

    // 玩家死亡处理
    if (player && !player.alive && !window.__deathHandled) {
      window.__deathHandled = true;
      onPlayerDeath();
    }
    if (player && player.alive) window.__deathHandled = false;

    checkLevelClear();
  } else {
    updateParticles(dt);
  }

  // 清理死亡坦克
  tanks = tanks.filter(t => t.alive || t.isPlayer);
}

/* ---------- 状态 ---------- */
function setState(s) {
  state = s;
  const ov = document.getElementById("overlay");
  const title = document.getElementById("ov-title");
  const final = document.getElementById("ov-final");
  const hint = document.getElementById("ov-hint");
  ov.classList.remove("hidden");
  if (s === "menu") {
    title.textContent = "准备就绪";
    final.textContent = "";
    hint.innerHTML = "按 <b>Enter</b> 开始游戏";
  } else if (s === "playing") {
    ov.classList.add("hidden");
  } else if (s === "paused") {
    title.textContent = "已暂停";
    hint.innerHTML = "按 <b>P</b> 或 <b>Enter</b> 继续";
  } else if (s === "levelclear") {
    title.textContent = "关卡完成！";
    final.textContent = `第 ${level} 关 · 得分 ${score}`;
    hint.innerHTML = "按 <b>Enter</b> 进入下一关";
  } else if (s === "gameover") {
    title.textContent = baseAlive ? "游戏结束" : "基地被摧毁";
    final.textContent = `最终得分 ${score}`;
    hint.innerHTML = "按 <b>Enter</b> 重新开始";
  }
  document.getElementById("btn-pause").textContent = s === "playing" ? "暂停" : "继续";
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.save();
  if (shake > 0) {
    const s = shake * 6;
    ctx.translate(rand(-s, s), rand(-s, s));
  }
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, CANVAS, CANVAS);

  drawTiles();
  drawBase();
  for (const p of powerups) drawPowerup(p);
  for (const b of bullets) drawBullet(b);
  for (const t of tanks) if (t.alive) drawTank(t);
  drawTrees();
  for (const p of particles) drawParticle(p);
  drawShield();

  ctx.restore();
  updateHUD();
}

function drawTiles() {
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const t = grid[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === BRICK) drawBrick(x, y);
      else if (t === STEEL) drawSteel(x, y);
      else if (t === WATER) drawWater(x, y);
      else if (t === TREE) drawTreeTile(x, y, false);
    }
  }
}
function drawBrick(x, y) {
  ctx.fillStyle = "#7a3b1e";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#b55a2c";
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = "#c96a35";
  // 砖纹
  ctx.fillRect(x + 2, y + 2, 17, 8); ctx.fillRect(x + 21, y + 2, 17, 8);
  ctx.fillRect(x + 11, y + 12, 17, 8); ctx.fillRect(x + 2, y + 12, 8, 8); ctx.fillRect(x + 30, y + 12, 8, 8);
  ctx.fillRect(x + 2, y + 22, 17, 8); ctx.fillRect(x + 21, y + 22, 17, 8);
  ctx.fillRect(x + 11, y + 32, 17, 6); ctx.fillRect(x + 2, y + 32, 8, 6); ctx.fillRect(x + 30, y + 32, 8, 6);
}
function drawSteel(x, y) {
  ctx.fillStyle = "#3a4552";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#8b96a5";
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = "#aab4c2";
  ctx.fillRect(x + 2, y + 2, TILE - 4, 4);
  ctx.fillRect(x + 2, y + 2, 4, TILE - 4);
  ctx.fillStyle = "#5c6774";
  ctx.fillRect(x + TILE - 6, y + 6, 4, TILE - 8);
  ctx.fillRect(x + 6, y + TILE - 6, TILE - 8, 4);
}
function drawWater(x, y) {
  ctx.fillStyle = "#123a63";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#1d5a94";
  const ph = (time * 2 + (x + y)) % 1;
  const wx = x + 4 + ph * 24;
  ctx.fillRect(wx, y + 6, 8, 3); ctx.fillRect(wx + 14, y + 20, 8, 3); ctx.fillRect(wx + 4, y + 32, 8, 3);
  ctx.fillStyle = "#2f7cc0";
  ctx.fillRect(x + 6, y + 10, 4, 3); ctx.fillRect(x + 18, y + 26, 4, 3);
}
function drawTreeTile(x, y, top) {
  ctx.fillStyle = "#0f3d1e";
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#1c6b34";
  for (let i = 0; i < 8; i++) {
    const tx = x + ((i * 13 + 5) % 34) + 3, ty = y + ((i * 17 + 7) % 34) + 3;
    ctx.fillRect(tx, ty, 6, 6);
  }
  ctx.fillStyle = "#288a44";
  ctx.fillRect(x + 14, y + 10, 8, 8); ctx.fillRect(x + 8, y + 24, 8, 6); ctx.fillRect(x + 24, y + 26, 6, 6);
}
function drawTrees() {
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (grid[r][c] === TREE) drawTreeTile(c * TILE, r * TILE, true);
}

function drawBase() {
  const x = baseRect.x, y = baseRect.y;
  // 底座
  ctx.fillStyle = "#5c6774";
  ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
  ctx.fillStyle = baseAlive ? "#d9a520" : "#555";
  // 老鹰（简化）
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 14);
  ctx.lineTo(x + 32, y + 14);
  ctx.lineTo(x + 32, y + 34);
  ctx.lineTo(x + 8, y + 34);
  ctx.closePath();
  ctx.fill();
  if (baseAlive) {
    ctx.fillStyle = "#fff3cf";
    // 翅膀
    ctx.beginPath(); ctx.moveTo(x + 11, y + 22); ctx.lineTo(x + 20, y + 17); ctx.lineTo(x + 20, y + 27); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 29, y + 22); ctx.lineTo(x + 20, y + 17); ctx.lineTo(x + 20, y + 27); ctx.closePath(); ctx.fill();
    // 头
    ctx.beginPath(); ctx.arc(x + 20, y + 20, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTank(t) {
  const cx = t.x + TANK / 2, cy = t.y + TANK / 2;
  const s = DRAW_TANK;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(DIRS[t.dir].ang);

  // 履带
  ctx.fillStyle = t.isPlayer ? "#8a6a10" : "#4a5058";
  ctx.fillRect(-s / 2, -s / 2, s, 6);
  ctx.fillRect(-s / 2, s / 2 - 6, s, 6);
  // 履带纹理
  ctx.fillStyle = t.isPlayer ? "#c79a1e" : "#2c323a";
  const toff = Math.floor(t.tread / 6) % 3;
  for (let i = -4; i <= 4; i++) ctx.fillRect(i * 8 - 2 + toff, -s / 2 + 1, 4, 4);
  for (let i = -4; i <= 4; i++) ctx.fillRect(i * 8 - 2 + toff, s / 2 - 5, 4, 4);

  // 车身
  const body = t.isPlayer ? "#d9a520" : (t.type ? t.type.color : "#c8cdd4");
  ctx.fillStyle = body;
  ctx.fillRect(-s / 2 + 7, -s / 2 + 6, s - 14, s - 12);

  // 炮塔
  ctx.fillStyle = t.isPlayer ? "#f6c945" : shade(body, -20);
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();

  // 炮管
  ctx.fillStyle = "#2c323a";
  ctx.fillRect(-2.5, -s / 2 + 2, 5, 14);

  ctx.restore();

  // 出生/无敌闪烁
  if (t.isPlayer && t.invincible > 0) {
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(time * 20);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, s / 2 + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (!t.isPlayer && t.spawnTimer > 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 3);
    ctx.fillStyle = "#ffffff";
    const r = 12;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a + 0.5) * r * 0.4, Math.sin(a + 0.5) * r * 0.4);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }
  if (t.isPlayer && t.level > 0) {
    // 火力等级指示
    ctx.fillStyle = "#ffd54a";
    for (let i = 0; i < t.level; i++) ctx.fillRect(t.x + 3 + i * 5, t.y + TANK - 5, 3, 3);
  }
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 0xff) + amt, 0, 255), b = clamp((n & 0xff) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x + BULLET / 2, b.y + BULLET / 2);
  ctx.rotate(DIRS[b.dir].ang);
  ctx.fillStyle = "#fff";
  ctx.fillRect(-2, -4, 4, 8);
  ctx.fillStyle = b.power ? "#ffd54a" : "#fff";
  ctx.fillRect(-2, -3, 4, 6);
  ctx.restore();
}

function drawPowerup(p) {
  const x = p.x + TILE / 2, y = p.y + TILE / 2;
  const blink = Math.sin(time * 10) > 0;
  ctx.save();
  ctx.globalAlpha = p.timer < 3 ? (blink ? 1 : 0.3) : 1;
  ctx.fillStyle = "#223";
  ctx.fillRect(p.x + 4, p.y + 4, TILE - 8, TILE - 8);
  const info = POWER_INFO[p.kind];
  ctx.fillStyle = info.color;
  ctx.font = "bold 22px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(p.kind === "star" ? "★" : p.kind === "tank" ? "♥" : p.kind === "grenade" ? "✸" : p.kind === "helmet" ? "⛨" : "❄", x, y);
  ctx.restore();
}

function drawParticle(p) {
  ctx.globalAlpha = clamp(p.life * 2, 0, 1);
  ctx.fillStyle = p.color;
  ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  ctx.globalAlpha = 1;
}

function drawShield() {
  if (shield <= 0 || !player || !player.alive) return;
  const cx = player.x + TANK / 2, cy = player.y + TANK / 2;
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.2 * Math.sin(time * 8);
  ctx.strokeStyle = "#8fb8ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, DRAW_TANK / 2 + 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* ---------- HUD ---------- */
function updateHUD() {
  document.getElementById("hud-score").textContent = score;
  document.getElementById("hud-hi").textContent = hiScore;
  document.getElementById("hud-level").textContent = level;

  const livesEl = document.getElementById("hud-lives");
  let html = "";
  for (let i = 0; i < Math.max(3, lives); i++) html += `<div class="tank-ico${i < lives ? "" : " off"}"></div>`;
  livesEl.innerHTML = html;

  const enEl = document.getElementById("hud-enemies");
  const remaining = spawnQueue.length + tanks.filter(t => t.alive && !t.isPlayer).length;
  let ehtml = "";
  for (let i = 0; i < Math.min(remaining, 20); i++) ehtml += `<div class="enemy-ico"></div>`;
  enEl.innerHTML = ehtml || '<span style="color:var(--muted);font-size:12px">无</span>';
}

/* ---------- Toast ---------- */
let toastEl = null;
function showToast(msg) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.style.cssText = "position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(246,201,69,.95);color:#1a1405;padding:8px 18px;border-radius:20px;font-weight:700;z-index:40;transition:opacity .3s;pointer-events:none;";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.opacity = 1;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.style.opacity = 0, 1200);
}

/* ---------- 输入 ---------- */
const KEYMAP = {
  ArrowUp: "up", KeyW: "w", ArrowDown: "down", KeyS: "s",
  ArrowLeft: "left", KeyA: "a", ArrowRight: "right", KeyD: "d",
  Space: " ", KeyJ: "j", Enter: "enter", KeyP: "p", KeyM: "m",
};
window.addEventListener("keydown", e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  keys.add(k);

  if (k === "enter") {
    if (state === "menu" || state === "gameover") startGame();
    else if (state === "levelclear") nextLevel();
    else if (state === "paused") setState("playing");
    else if (state === "playing") { /* 忽略 */ }
  }
  if (k === "p") {
    if (state === "playing") setState("paused");
    else if (state === "paused") setState("playing");
  }
  if (k === "m") toggleSound();
});
window.addEventListener("keyup", e => {
  const k = KEYMAP[e.code];
  if (k) keys.delete(k);
});

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("btn-sound").textContent = "声音:" + (soundOn ? "开" : "关");
}

document.getElementById("btn-pause").addEventListener("click", () => {
  if (state === "playing") setState("paused");
  else if (state === "paused") setState("playing");
  else if (state === "menu" || state === "gameover") startGame();
  else if (state === "levelclear") nextLevel();
});
document.getElementById("btn-sound").addEventListener("click", toggleSound);

// 触屏
document.querySelectorAll("#touch button").forEach(btn => {
  const k = btn.dataset.k;
  const press = () => keys.add(k);
  const release = () => keys.delete(k);
  btn.addEventListener("pointerdown", e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press(); });
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
});

/* ---------- 启动 ---------- */
try { hiScore = parseInt(localStorage.getItem("tank-hiscore") || "0", 10) || 0; } catch (e) {}
updateHUD();
setState("menu");
requestAnimationFrame(frame);
</script>
